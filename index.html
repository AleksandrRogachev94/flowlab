<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stable Fluids</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main>
      <header>
        <h1>Stable Fluids</h1>
        <div class="controls">
          <button id="restart" type="button">Restart (R)</button>
          <button id="toggleView" type="button">View (D)</button>
          <button id="nextScene" type="button">Scene (S)</button>
          <button id="nextTracer" type="button">Dye (T)</button>
          <button id="toggleScheme" type="button">Advection (A)</button>
        </div>
      </header>
      <!-- #stage is what main.ts measures to size the canvas. The canvas is
           taken out of flow so it can never feed back into that measurement. -->
      <div id="stage"><canvas id="view"></canvas></div>
      <pre id="readout"></pre>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

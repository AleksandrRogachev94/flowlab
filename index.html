<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stable Fluids</title>
    <meta
      name="description"
      content="A real-time incompressible fluid solver in the browser, on the GPU."
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <!-- The canvas IS the page: fixed to the whole viewport, and sized in
         device pixels by main.ts. There is no layout to measure and nothing
         for the chrome to push around — every control floats over it inside
         #ui, which is transparent to the pointer except where a widget is. -->
    <canvas id="view"></canvas>
    <div id="ui"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
